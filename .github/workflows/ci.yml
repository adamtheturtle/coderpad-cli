name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv run --locked pytest
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
      - run: uv build
      - run: uv run --locked twine check dist/*
      - run: uv run --locked check-wheel-contents dist/*.whl
      - name: Smoke installed wheel
        run: |
          uv venv /tmp/coderpad-wheel
          uv pip install --python /tmp/coderpad-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/coderpad-wheel/bin/coderpad --help
          /tmp/coderpad-wheel/bin/coderpad --version
          /tmp/coderpad-wheel/bin/python -m coderpad_cli questions upload --help
      - run: docker build -t coderpad-cli .
      - run: docker run --rm coderpad-cli --help
